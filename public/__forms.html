<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><meta name="robots" content="noindex" /><title>Forms</title></head>
  <body>
    <!-- Netlify Forms registration. Keep field names in sync with src/components/EnquiryForm.tsx -->
    <form name="enquiry" data-netlify="true" netlify-honeypot="company" hidden>
      <input type="hidden" name="form-name" value="enquiry" />
      <input name="company" />
      <input name="name" />
      <input name="phone" type="tel" />
      <input name="email" type="email" />
      <select name="clinic"><option>london</option><option>glasgow</option></select>
      <input name="preferred_time" />
      <input name="area" />
      <textarea name="message"></textarea>
      <input type="checkbox" name="age" value="yes" />
      <input type="checkbox" name="consent" value="yes" />
      <input type="checkbox" name="marketing" value="yes" />
    </form>
  </body>
</html>
