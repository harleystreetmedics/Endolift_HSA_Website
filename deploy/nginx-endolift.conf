# nginx server block for the Endomax Lift site on the DigitalOcean droplet.
# Copy to /etc/nginx/sites-available/endolift and symlink into sites-enabled.
# Certbot adds the HTTPS (443) block and the HTTP→HTTPS redirect.
server {
    listen 80;
    listen [::]:80;
    server_name endolift.harleystreetaesthetic.co.uk;

    root /var/www/endolift;
    index index.html;

    # Static export with trailingSlash: /pricing/ → /pricing/index.html
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;

    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/endolift-headers.conf;
    }

    location /og/ {
        add_header Cache-Control "public, max-age=604800" always;
        include /etc/nginx/snippets/endolift-headers.conf;
    }

    include /etc/nginx/snippets/endolift-headers.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;
}
